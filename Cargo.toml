[workspace]
resolver = "2"
members = ["ledger-tron-core"]

[workspace.package]
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
repository = "https://github.com/elabify/maknoon-ledger-tron-rs"
authors = ["Benjamin Chodroff"]

[workspace.dependencies]
uniffi = { version = "0.31", default-features = false }
async-trait = "0.1"
thiserror = "1"
hex = "0.4"
tokio = { version = "1", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["std"] }
sha2 = "0.10"
sha3 = "0.10"
# secp256k1 with recovery for the TIP-191 message sign (software) +
# host-side address recovery (Ledger). Pinned to match ledger-btc-rs.
secp256k1 = { version = "0.29", features = ["recovery"] }

[profile.release]
strip = false
lto = "thin"
opt-level = 3
codegen-units = 1
